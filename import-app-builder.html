<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Import ADM-202 · QCM Trainer</title><style>body{margin:0;background:#0b0d10;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#12161c;border:1px solid #28303b;border-radius:16px;padding:22px}h1{margin-top:0}.muted{color:#9ba6b5}.primary,.ghost{padding:11px 16px;border-radius:10px;font:inherit;cursor:pointer}.primary{background:#7c9cff;color:white;border:0;font-weight:700}.ghost{background:transparent;color:#eef2f7;border:1px solid #28303b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input{width:100%;padding:12px;box-sizing:border-box;background:#181d25;color:#eef2f7;border:1px solid #28303b;border-radius:10px;margin:10px 0}#status{margin-top:14px;line-height:1.5}.good{color:#54d68a}.bad{color:#ff6b7a}</style></head><body><div class="wrap"><div class="card"><h1>Import ADM-202 · Platform App Builder</h1><p class="muted">This imports the new 2026 App Builder practice-test PDF and replaces the currently active ADM-202 bank. Exact duplicate question+answer pairs are removed.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="pdf" type="file" accept="application/pdf"><div class="actions"><button class="primary" id="run">Import PDF</button><button class="ghost" onclick="location.href='./'">Back to QCM Trainer</button></div><div id="status"></div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const URL='https://umlrugknndundkrfvofa.supabase.co',KEY='sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l',OWNER='a40bea08-44dd-4c34-a455-38bfc7e68cb6';
const supabase=createClient(URL,KEY);const $=id=>document.getElementById(id);const set=(m,c='')=>{$('status').textContent=m;$('status').className=c};
const clean=s=>String(s??'').replace(/www\s*\.\s*priscillahongsalesforce\s*\.\s*com/gi,'').replace(/IT Certification Guaranteed, The Easy Way!/gi,'').replace(/https?:\/\/\S+/gi,'').replace(/\s+/g,' ').trim();
function stripAnswerMarker(s){return String(s??'').replace(/\s*(?:Correct Answer|Answer):\s*[A-E](?:\s*(?:,|and)\s*[A-E])*\s*$/i,'').trim()}
async function pageText(page){const c=await page.getTextContent();const rows=new Map();for(const item of c.items){if(!item.str)continue;const y=Math.round(item.transform[5]);if(!rows.has(y))rows.set(y,[]);rows.get(y).push(item)}return [...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,items])=>items.sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' ').trim()).filter(Boolean)}
async function extract(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let lines=[];for(let p=1;p<=pdf.numPages;p++)lines.push(...await pageText(await pdf.getPage(p)));lines=lines.filter(x=>!/^\d{1,3}$/.test(x.trim())&&!/^IT Certification Guaranteed, The Easy Way!$/i.test(x.trim()));const text=lines.join('\n');const isNew=/Question\s+\d+\s*\|/i.test(text);const parts=isNew?text.split(/Question\s+(\d+)\s*\|[^\n]*\n/i):text.split(/QUESTION NO:\s*(\d+)\s*\n/i);const qs=[];for(let i=1;i<parts.length;i+=2){const id=Number(parts[i]),block=parts[i+1]||'';const answerMatch=block.match(/(?:^|\n)(?:Correct Answer|Answer):\s*([A-E](?:\s*(?:,|and)\s*[A-E])*)\s*(?=\n|$)/i);if(!answerMatch)continue;const correct=[...answerMatch[1].toUpperCase().matchAll(/[A-E]/g)].map(m=>m[0]).filter((v,i,a)=>a.indexOf(v)===i);const pre=block.slice(0,answerMatch.index).trim();let explanation=block.slice(answerMatch.index+answerMatch[0].length);explanation=explanation.replace(/^\s*Explanation:\s*/i,'');const optionMatches=[...pre.matchAll(/(?:^|\n)([A-E])\.\s*([\s\S]*?)(?=\n[A-E]\.\s|$)/g)];if(!optionMatches.length)continue;const options={};for(const m of optionMatches)options[m[1]]=clean(stripAnswerMarker(m[2]));let question=pre.slice(0,optionMatches[0].index);question=clean(question.replace(/\bChoose\s+\d+\s+answers?\b/ig,''));if(!question)continue;qs.push({id,source:'ADM-202 2026 App Builder Practice Tests',correct,options,question,explanation:clean(explanation)})}const seen=new Set(),ded=[];for(const q of qs){const key=clean(q.question).toLowerCase()+'|'+q.correct.join(',');if(seen.has(key))continue;seen.add(key);ded.push(q)}return {total:qs.length,deduped:ded.length,questions:ded}}
$('run').onclick=async()=>{try{const file=$('pdf').files[0];if(!file)return set('Choose the new 2026 App Builder PDF first.','bad');set('Signing in…');const auth=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(auth.error)throw auth.error;if(auth.data.user.id!==OWNER)throw new Error('This import tool is restricted to the QCM Trainer owner account.');set('Reading the PDF…');const out=await extract(file);if(out.deduped<1)throw new Error('No questions were extracted. Check that this is the new App Builder PDF.');set(`Extracted ${out.total} questions; ${out.total-out.deduped} exact duplicate removed. Publishing…`);const off=await supabase.from('question_banks').update({is_active:false}).eq('name','ADM-202 V12.35 PDF');if(off.error)throw off.error;const ins=await supabase.from('question_banks').insert({user_id:auth.data.user.id,name:'ADM-202 V12.35 PDF',question_count:out.deduped,questions:out.questions,is_active:true}).select('id').single();if(ins.error)throw ins.error;set(`Done: ${out.deduped} unique questions are now live in ADM-202.`,'good');setTimeout(()=>location.href='./',1000)}catch(e){console.error(e);set(e.message||String(e),'bad')}};
</script></body></html>
