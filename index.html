<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><link rel="manifest" href="./manifest.webmanifest">
<title>QCM Trainer</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#181d25;--text:#eef2f7;--muted:#9ba6b5;--line:#28303b;--accent:#7c9cff;--good:#54d68a;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:1000px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 42px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:750;font-size:20px}.nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
.nav button,.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 11px;border-radius:9px}
.nav button.active,.nav button:hover{color:var(--text);background:var(--panel2)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:var(--panel2);border-radius:12px}.stat b{font-size:24px;display:block;margin-top:5px}
.muted{color:var(--muted)}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{font-weight:700}
.progress{height:7px;background:#252b34;border-radius:99px;overflow:hidden;margin:15px 0 24px}.bar{height:100%;background:var(--accent);transition:width .2s}
.q{font-size:20px;line-height:1.45;margin:16px 0 20px}.answers{display:grid;gap:10px}
.answer{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--text)}
.answer input{margin-top:4px;accent-color:var(--accent)}.answer.correct{border-color:var(--good)}.answer.incorrect{border-color:var(--bad)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{margin-top:18px;padding:15px;border-radius:12px;border:1px solid var(--line)}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}
.explain{line-height:1.55;color:#d5dbe4}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}
.empty{padding:30px;text-align:center;color:var(--muted)}.notice{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);line-height:1.5}
label.file{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:11px 14px;border-radius:10px;cursor:pointer}input[type=file]{display:none}
input[type=email],input[type=password]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:10px 0}
.status{margin-top:12px;color:var(--muted)}.danger{color:var(--bad)}.good{color:var(--good)}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.app{padding:12px}header{align-items:flex-start;flex-direction:column}.q{font-size:18px}}
/* QCM Trainer polished mode selector */

.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}
.mode-card{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:215px;padding:23px;background:linear-gradient(145deg,#151b24,#10151c);color:var(--text);border:1px solid var(--line);border-radius:17px;text-align:left;overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.mode-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}
.mode-card:hover{transform:translateY(-3px);border-color:#4a5a73;box-shadow:0 12px 32px rgba(0,0,0,.26)}
.mode-card:active{transform:translateY(-1px) scale(.995)}
.mode-card h2{margin:10px 0 7px;font-size:15px;letter-spacing:.09em;font-weight:800}
.mode-count{font-size:30px;line-height:1;font-weight:800;letter-spacing:-.5px;margin:13px 0 9px}
.mode-desc{font-size:14px;line-height:1.55;color:var(--muted)}
.mode-desc b{color:var(--text);font-weight:650}
.mode-kicker{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;letter-spacing:.11em;font-weight:750}
.mode-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.mode-arrow{margin-top:auto;padding-top:20px;color:var(--accent);font-size:13px;font-weight:750}
#fullMode:before{background:#667487}
#fullMode .mode-dot{background:#667487}
@media(max-width:720px){.mode-grid{grid-template-columns:1fr;gap:12px}.mode-card{min-height:185px;padding:20px}.mode-count{font-size:27px}}

</style>
</head>
<body><div class="app"><header><div class="brand">QCM Trainer</div><nav class="nav" id="nav"></nav></header><main id="main"></main></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://umlrugknndundkrfvofa.supabase.co", SUPABASE_KEY="sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l";
const OWNER_ID="a40bea08-44dd-4c34-a455-38bfc7e68cb6";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"qcm-trainer-auth"}});
const LOCAL_BANK_URL="./questions.json";
let bank=[], bankId=null, user=null, quiz=null, page="dashboard", authMode="signin", recoveryMode=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const pct=(n,d)=>d?Math.round(n/d*1000)/10:0;

async function loadUser(){
 const {data}=await supabase.auth.getSession(); user=data.session?.user||null;
 if(user){
   const {data:b,error}=await supabase.from("question_banks").select("*").eq("is_active",true).order("created_at",{ascending:false}).limit(1).maybeSingle();
   if(error) console.error(error);
   if(b){bank=b.questions; bankId=b.id;} else {bank=[]; bankId=null;}
 } else {bank=[]; bankId=null;}
}
supabase.auth.onAuthStateChange(async (event,session)=>{
 user=session?.user||null;
 if(event==="PASSWORD_RECOVERY"){recoveryMode=true; authMode="recovery"; render(); return;}
 if(user){await loadUser();} else {bank=[]; bankId=null;}
 if(!recoveryMode){page="dashboard"; render();}
});
async function signIn(){
 const email=$("#email").value.trim(), password=$("#password").value;
 if(!email||!password){$("#loginStatus").textContent="Enter your email and password.";return;}
 $("#loginStatus").textContent="Signing in…";
 const {error}=await supabase.auth.signInWithPassword({email,password});
 $("#loginStatus").textContent=error?error.message:"Signed in.";
 if(!error){await loadUser();render();}
}
async function signUp(){
 const email=$("#email").value.trim(), password=$("#password").value;
 if(!email||password.length<6){$("#loginStatus").textContent="Enter an email and a password of at least 6 characters.";return;}
 $("#loginStatus").textContent="Creating account…";
 const {data,error}=await supabase.auth.signUp({email,password});
 if(error){$("#loginStatus").textContent=error.message;return;}
 if(data.session){await loadUser();render();}
 else $("#loginStatus").textContent="Account created. Confirm your email once if required, then sign in.";
}
async function resetPassword(){
 const email=$("#email").value.trim(); if(!email){$("#loginStatus").textContent="Enter your email first.";return;}
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:"https://nathanboccardi-irl.github.io/qcm-trainer/"});
 $("#loginStatus").textContent=error?error.message:"Password reset email sent.";
}
async function updatePassword(){
 const password=$("#newPassword").value;
 const confirm=$("#confirmPassword").value;
 if(password.length<6){$("#recoveryStatus").textContent="Password must be at least 6 characters.";return;}
 if(password!==confirm){$("#recoveryStatus").textContent="Passwords do not match.";return;}
 $("#recoveryStatus").textContent="Updating password…";
 const {error}=await supabase.auth.updateUser({password});
 if(error){$("#recoveryStatus").textContent=error.message;return;}
 recoveryMode=false; authMode="signin";
 $("#recoveryStatus").textContent="Password updated. You are signed in.";
 await loadUser();
 page="dashboard";
 render();
}
async function logout(){await supabase.auth.signOut();}
function nav(){$("#nav").innerHTML=user?[["dashboard","Dashboard"],["quiz","Start Quiz"],["history","Quiz History"],["bank","Question Bank"],["settings","Settings"]].map(([id,l])=>`<button class="${page===id?"active":""}" data-page="${id}">${l}</button>`).join("")+`<button id="logout">Sign out</button>`:"";$("#nav").querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if($("#logout"))$("#logout").onclick=logout;}
function render(){nav(); if(!user)return loginPage(); if(page==="dashboard")dashboard(); if(page==="quiz")quizPage(); if(page==="history")historyPage(); if(page==="bank")bankPage(); if(page==="settings")settingsPage();}
function loginPage(){
 if(recoveryMode){
  $("#main").innerHTML=`<section class="card"><h1>Set your new password</h1><p class="muted">Choose a new password for your QCM Trainer account.</p><input id="newPassword" type="password" placeholder="New password" autocomplete="new-password"><input id="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password"><div class="actions"><button class="primary" id="updatePasswordBtn">Update Password</button></div><div id="recoveryStatus" class="status"></div></section>`;
  $("#updatePasswordBtn").onclick=updatePassword;
  return;
 }
 $("#main").innerHTML=`<section class="card"><h1>${authMode==="signin"?"Welcome back":"Create your account"}</h1><p class="muted">Sign in once and QCM Trainer will keep your session on this device.</p><div style="display:flex;gap:8px;margin:18px 0 4px"><button class="ghost ${authMode==="signin"?"active":""}" id="signInTab">Sign In</button><button class="ghost ${authMode==="signup"?"active":""}" id="signUpTab">Create Account</button></div><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="${authMode==="signin"?"current-password":"new-password"}"><div class="actions"><button class="primary" id="authBtn">${authMode==="signin"?"Sign In":"Create Account"}</button></div>${authMode==="signin"?`<button class="ghost" id="forgot" style="margin-top:12px">Forgot Password?</button>`:""}<div id="loginStatus" class="status"></div></section>`;
 $("#signInTab").onclick=()=>{authMode="signin";render()};
 $("#signUpTab").onclick=()=>{authMode="signup";render()};
 $("#authBtn").onclick=authMode==="signin"?signIn:signUp;
 if($("#forgot"))$("#forgot").onclick=resetPassword;
}
function startQuiz(mode="exam"){quiz={mode,items:mode==="full"?shuffle(bank):shuffle(bank).slice(0,Math.min(65,bank.length)),index:0,answers:[],correct:0,locked:false};page="quiz";render();}
function quizPage(){if(!quiz)return dashboard();if(quiz.index>=quiz.items.length)return finishQuiz();const q=quiz.items[quiz.index],sel=quiz.answers[quiz.index]?.selected||[],multi=q.correct.length>1;const score=pct(quiz.correct,quiz.items.length);$("#main").innerHTML=`<section class="card"><div class="topline"><span class="pill">${quiz.mode==="exam"?"Exam Mode":"Full Mode"} · Question ${quiz.index+1} / ${quiz.items.length}</span><span class="score">Score: ${score}%</span></div><div class="progress"><div class="bar" style="width:${quiz.index/quiz.items.length*100}%"></div></div><div class="muted">${multi?"Select all that apply":"Select one answer"}</div><div class="q">${esc(q.question)}</div><div class="answers">${Object.entries(q.options).map(([k,v])=>`<label class="answer ${quiz.locked&&q.correct.includes(k)?"correct":""} ${quiz.locked&&sel.includes(k)&&!q.correct.includes(k)?"incorrect":""}"><input type="${multi?"checkbox":"radio"}" name="answer" value="${k}" ${sel.includes(k)?"checked":""} ${quiz.locked?"disabled":""}><span><b>${k}.</b> ${esc(v)}</span></label>`).join("")}</div>${quiz.locked?`<div class="feedback ${quiz.answers[quiz.index].correct?"good":"bad"}"><strong>${quiz.answers[quiz.index].correct?"Correct":"Incorrect"}</strong><div class="explain"><b>Correct answer:</b> ${q.correct.join(", ")}<br><br>${esc(q.explanation)}</div></div>`:""}<div class="actions">${quiz.locked?`<button class="primary" id="next">${quiz.index===quiz.items.length-1?"Finish Quiz":"Next Question"}</button>`:`<button class="primary" id="validate">Validate Answer</button>`}</div></section>`;if(!quiz.locked)$("#validate").onclick=()=>{const vals=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(!vals.length)return;const ok=vals.length===q.correct.length&&vals.every(x=>q.correct.includes(x));quiz.answers[quiz.index]={selected:vals,correct:ok};if(ok)quiz.correct++;quiz.locked=true;render();};else $("#next").onclick=()=>{quiz.index++;quiz.locked=false;render();};}
async function finishQuiz(){const total=quiz.items.length,percentage=pct(quiz.correct,total),mode=quiz.mode;const record={user_id:user.id,question_bank_id:bankId,mode,score:quiz.correct,total,percentage,passed:mode==="exam"?percentage>=60:true,completed_at:new Date().toISOString(),answers:quiz.answers};const {error}=await supabase.from("quiz_attempts").insert(record);if(error)console.error(error);const result={mode,score:quiz.correct,total,percentage,passed:record.passed};quiz=null;showResult(result);}
function showResult(r){$("#main").innerHTML=`<section class="card result-card"><div class="pill">${r.mode==="exam"?"Exam Mode":"Full Mode"}</div><h1>Final Score</h1><div class="result-score">${r.score} / ${r.total}</div><div class="result-score">${r.percentage}%</div>${r.mode==="exam"?`<p class="${r.passed?"passed":"failed"}><b>${r.passed?"PASSED":"FAILED"}</b> — ${r.passed?"You reached the 60% passing score.":"You need at least 60% to pass."}</p>`:`<p class="muted">Full Mode completed. Your final percentage is shown above.</p>`}<div class="actions"><button class="ghost" id="historyBtn">View History</button><button class="primary" id="retry">Retry ${r.mode==="exam"?"Exam":"Full Mode"}</button></div></section>`;$("#historyBtn").onclick=()=>{page="history";render()};$("#retry").onclick=()=>startQuiz(r.mode);}

async function historyPage(){const {data:h,error}=await supabase.from("quiz_attempts").select("score,total,percentage,passed,completed_at,mode").eq("user_id",user.id).order("completed_at",{ascending:false});const rows=h||[];const exams=rows.filter(x=>x.mode!=="full"),fulls=rows.filter(x=>x.mode==="full");const avg=rows.length?Math.round(rows.reduce((s,x)=>s+Number(x.percentage),0)/rows.length*10)/10:0,best=rows.length?Math.max(...rows.map(x=>Number(x.percentage))):0,pass=exams.length?Math.round(exams.filter(x=>x.passed).length/exams.length*100):0;$("#main").innerHTML=`<section class="card"><h1>Quiz History</h1><div class="grid"><div class="stat"><span class="muted">Tests completed</span><b>${rows.length}</b></div><div class="stat"><span class="muted">Average score</span><b>${avg}%</b></div><div class="stat"><span class="muted">Best score</span><b>${best}%</b></div><div class="stat"><span class="muted">Exam pass rate</span><b>${pass}%</b></div></div><p class="muted">Exam tests: ${exams.length} · Full tests: ${fulls.length}</p>${rows.length?`<table><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Percentage</th><th>Result</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.completed_at).toLocaleString()}</td><td>${x.mode==="full"?"Full":"Exam"}</td><td>${x.score}/${x.total}</td><td>${x.percentage}%</td><td>${x.mode==="full"?"—":(x.passed?"✅ Passed":"❌ Failed")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No tests completed yet.</div>`}<div class="actions"><button class="primary" id="newQuiz">Start New Quiz</button></div></section>`;$("#newQuiz").onclick=()=>{page="dashboard";render()};}
function bankPage(){$("#main").innerHTML=`<section class="card"><h1>Question Bank</h1><p class="muted">Current bank: <b>${bank.length} questions</b></p><label class="file">📄 Import New PDF<input id="pdf" type="file" accept="application/pdf"></label><div class="notice">Importing a PDF replaces your cloud question bank for your account only. Your quiz history is kept.</div><div id="importStatus"></div></section>`;$("#pdf").onchange=importPDF;}
async function importPDF(e){const file=e.target.files[0];if(!file)return;const status=$("#importStatus");status.textContent="Reading PDF…";try{const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let text="";for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(" ")+"\n";}const parsed=parseImportedText(text);if(parsed.length<1)throw Error("No questions were detected.");if(!confirm(`Detected ${parsed.length} questions. Replace your current question bank?`))return;const {data:old}=await supabase.from("question_banks").select("id").eq("user_id",user.id).eq("is_active",true).order("created_at",{ascending:false}).limit(1).maybeSingle();if(old?.id){await supabase.from("question_banks").update({is_active:false}).eq("id",old.id);}const {data:newBank,error}=await supabase.from("question_banks").insert({user_id:user.id,name:file.name,question_count:parsed.length,questions:parsed,is_active:true}).select().single();if(error)throw error;bank=newBank.questions;status.innerHTML=`<span class="good">Imported ${bank.length} questions successfully.</span>`;}catch(err){status.innerHTML=`<span class="danger">${esc(err.message)}</span>`}}
function parseImportedText(text){const out=[];for(const part of text.split(/(?=NO\.\s*\d+\b)/)){const m=part.match(/^NO\.\s*(\d+)\s+/),a=part.match(/Answer:\s*([A-D](?:\s+[A-D])*)/);if(!m||!a)continue;const before=part.slice(0,a.index),opts=[...before.matchAll(/(?:^|\n)\s*([A-D])\.\s*(.*?)(?=\n\s*[A-D]\.\s|$)/gs)];if(opts.length!==4)continue;const q=before.slice(0,opts[0].index).replace(/^NO\.\s*\d+\s*/,"").replace(/\s+/g," ").trim(),options={};opts.forEach(o=>options[o[1]]=o[2].replace(/\s+/g," ").trim());const ex=part.match(/Explanation:\s*(.*?)(?=NO\.\s*\d+\b|$)/s);out.push({id:Number(m[1]),question:q,options,correct:a[1].split(/\s+/),explanation:(ex?.[1]||"").replace(/\s+/g," ").trim(),source:"Imported PDF"})}return out.sort((a,b)=>a.id-b.id);}
function settingsPage(){$("#main").innerHTML=`<section class="card"><h1>Settings</h1><p class="muted">Exam Mode: 65 random questions · Full Mode: all questions</p><p class="muted">Passing score: 60%</p><p class="muted">Cloud sync: <span class="good">Enabled</span></p><p class="muted">Signed in as: ${esc(user.email)}</p><div class="notice">Quiz history is private to each account. The question bank is shared for practice; only the owner can replace it.</div></section>`;}
await loadUser();render();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js?v=4").catch(()=>{});
</script></body></html>
