<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="./manifest.webmanifest">
<title>QCM Trainer</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#181d25;--text:#eef2f7;--muted:#9ba6b5;--line:#28303b;--accent:#7c9cff;--good:#54d68a;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.app{max-width:1000px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(42px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:800;font-size:20px}.nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}.nav button,.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 12px;border-radius:10px}.nav button.active,.nav button:hover,.ghost.active{color:var(--text);background:var(--panel2)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.16)}h1{font-size:32px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:var(--panel2);border-radius:12px}.stat b{font-size:24px;display:block;margin-top:5px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{font-weight:700}.progress{height:7px;background:#252b34;border-radius:99px;overflow:hidden;margin:15px 0 24px}.bar{height:100%;background:var(--accent);transition:width .2s}.q{font-size:20px;line-height:1.45;margin:16px 0 20px}.answers{display:grid;gap:10px}.answer{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--text)}.answer input{margin-top:4px;accent-color:var(--accent)}.answer.correct{border-color:var(--good)}.answer.incorrect{border-color:var(--bad)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.feedback{margin-top:18px;padding:15px;border-radius:12px;border:1px solid var(--line)}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}.explain{line-height:1.55;color:#d5dbe4}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}.status{margin-top:12px;color:var(--muted);line-height:1.45}.danger{color:var(--bad)}.good{color:var(--good)}input[type=email],input[type=password]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:10px 0;font-size:16px}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}.empty{padding:30px;text-align:center;color:var(--muted)}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.mode-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:190px;padding:23px;background:linear-gradient(145deg,#151b24,#10151c);color:var(--text);border:1px solid var(--line);border-radius:17px;text-align:left;overflow:hidden;cursor:pointer}.mode-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}.mode-card h2{margin:10px 0 7px;font-size:15px;letter-spacing:.09em;font-weight:800}.mode-count{font-size:30px;font-weight:800;margin:13px 0 9px}.mode-desc{font-size:14px;line-height:1.55;color:var(--muted)}.mode-arrow{margin-top:auto;padding-top:20px;color:var(--accent);font-size:13px;font-weight:750}.result{font-size:52px;font-weight:850;margin:8px 0}.result.pass{color:var(--good)}.result.fail{color:var(--bad)}@media(max-width:720px){.app{padding:12px}.grid{grid-template-columns:1fr 1fr}.mode-grid{grid-template-columns:1fr;gap:12px}header{align-items:flex-start;flex-direction:column}.q{font-size:18px}.topline{align-items:flex-start;flex-direction:column}.nav{width:100%}}

.quick-card:before{background:#9a7cff!important}
.quick-card .mode-arrow{color:#9a7cff!important}
@media(max-width:720px){.mode-grid{grid-template-columns:1fr}.mode-card{width:100%}}
</style>
</head>
<body><div class="app"><header><div class="brand">QCM Trainer</div><nav class="nav" id="nav"></nav></header><main id="main"></main></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://umlrugknndundkrfvofa.supabase.co";
const SUPABASE_KEY="sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l";
const OWNER_ID="a40bea08-44dd-4c34-a455-38bfc7e68cb6";
const AUTH_STORAGE_KEY="qcm-trainer-auth-v3";
const AUTH_DB_NAME="qcm-trainer-auth";
const AUTH_DB_STORE="kv";
function openAuthDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return}const r=indexedDB.open(AUTH_DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(AUTH_DB_STORE))r.result.createObjectStore(AUTH_DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbGet(key){const db=await openAuthDb();return new Promise((resolve,reject)=>{const r=db.transaction(AUTH_DB_STORE,"readonly").objectStore(AUTH_DB_STORE).get(key);r.onsuccess=()=>resolve(r.result??null);r.onerror=()=>reject(r.error)})}
async function idbSet(key,value){const db=await openAuthDb();return new Promise((resolve,reject)=>{const r=db.transaction(AUTH_DB_STORE,"readwrite").objectStore(AUTH_DB_STORE).put(value,key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
async function idbRemove(key){const db=await openAuthDb();return new Promise((resolve,reject)=>{const r=db.transaction(AUTH_DB_STORE,"readwrite").objectStore(AUTH_DB_STORE).delete(key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
const authStorage={getItem:async key=>{try{return await idbGet(key)}catch(e){return window.localStorage.getItem(key)}},setItem:async(key,value)=>{try{await idbSet(key,value)}catch(e){window.localStorage.setItem(key,value)}},removeItem:async key=>{try{await idbRemove(key)}catch(e){}try{window.localStorage.removeItem(key)}catch(e){}}};
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:authStorage,storageKey:AUTH_STORAGE_KEY,flowType:"pkce"}});
let user=null,bank=[],bankId=null,page="dashboard",authMode="signin",quiz=null,recoveringPassword=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const pct=(n,d)=>d?Math.round(n/d*1000)/10:0;
function setStatus(msg,cls=""){const e=$("status");if(e){e.textContent=msg;e.className="status "+cls}}
async function loadBank(){const r=await supabase.from("question_banks").select("id,questions,question_count,is_active,created_at").eq("is_active",true).order("created_at",{ascending:false}).limit(10);if(r.error){console.error("Question bank load failed:",r.error);bank=[];bankId=null;return}const row=(r.data||[])[0];bank=Array.isArray(row?.questions)?row.questions:[];bankId=row?.id||null}
async function migrateAuthSession(){try{const old=window.localStorage.getItem("qcm-trainer-auth-v2");const current=await authStorage.getItem(AUTH_STORAGE_KEY);if(old&&!current)await authStorage.setItem(AUTH_STORAGE_KEY,old)}catch(e){console.warn("Auth storage migration skipped",e)}}
async function boot(){try{await migrateAuthSession();if(navigator.storage?.persist)await navigator.storage.persist().catch(()=>{});const r=await supabase.auth.getSession();user=r.data.session?.user||null;if(user)await loadBank();render()}catch(e){console.error(e);user=null;render()}}
function render(){renderNav();if(recoveringPassword){renderPasswordRecovery();return}if(!user){renderLogin();return}if(page==='dashboard')renderDashboard();else if(page==='quiz')renderQuiz();else if(page==='history')renderHistory();else if(page==='bank')renderBank();else renderSettings()}

function renderNav(){if(!user){$("nav").innerHTML="";return}$("nav").innerHTML=`<button class="${page==='dashboard'?'active':''}" data-p="dashboard">Dashboard</button><button class="${page==='quiz'?'active':''}" data-p="quiz">Start Quiz</button><button class="${page==='history'?'active':''}" data-p="history">Quiz History</button><button class="${page==='bank'?'active':''}" data-p="bank">Question Bank</button><button class="${page==='settings'?'active':''}" data-p="settings">Settings</button><button id="logout">Sign out</button>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});$("logout").onclick=async()=>{await supabase.auth.signOut();user=null;bank=[];quiz=null;render()}}
function renderLogin(){$("main").innerHTML=`<section class="card"><h1>${authMode==='signin'?'Welcome back':'Create your account'}</h1><p class="muted">${authMode==='signin'?'Sign in once and QCM Trainer will keep your session on this device.':'Create your personal QCM Trainer account.'}</p><div style="display:flex;gap:8px;margin:18px 0 4px"><button class="ghost ${authMode==='signin'?'active':''}" id="signinTab">Sign In</button><button class="ghost ${authMode==='signup'?'active':''}" id="signupTab">Create Account</button></div><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="${authMode==='signin'?'current-password':'new-password'}"><div class="actions"><button class="primary" id="authBtn">${authMode==='signin'?'Sign In':'Create Account'}</button></div>${authMode==='signin'?'<div class="actions" style="justify-content:flex-start"><button class="ghost" id="forgot">Forgot Password?</button></div>':''}<div id="status" class="status"></div></section>`;$('signinTab').onclick=()=>{authMode='signin';render()};$('signupTab').onclick=()=>{authMode='signup';render()};$('authBtn').onclick=authMode==='signin'?signIn:signUp;$("forgot")?.addEventListener('click',sendReset)}

async function signIn(){const email=$("email").value.trim(),password=$("password").value;if(!email||!password){setStatus('Enter your email and password.');return}setStatus('Signing in…');const r=await supabase.auth.signInWithPassword({email,password});if(r.error){setStatus(r.error.message,'danger');return}user=r.data.user;await loadBank();page='dashboard';render()}
async function signUp(){const email=$("email").value.trim(),password=$("password").value;if(!email||password.length<6){setStatus('Enter an email and a password of at least 6 characters.');return}setStatus('Creating account…');const r=await supabase.auth.signUp({email,password});if(r.error){setStatus(r.error.message,'danger');return}if(r.data.session){user=r.data.user;await loadBank();page='dashboard';render()}else setStatus('Account created. Confirm your email if required, then sign in.','good')}
async function sendMagic(){const email=$("email").value.trim();if(!email){setStatus('Enter your email first.');return}setStatus('Sending magic link…');const r=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});setStatus(r.error?r.error.message:'Magic link sent. Open it on this device.',r.error?'danger':'good')}
async function sendReset(){const email=$("email").value.trim();if(!email){setStatus('Enter your email first.');return}setStatus('Sending password reset…');const r=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});setStatus(r.error?r.error.message:'Password reset email sent.',r.error?'danger':'good')}
function renderPasswordRecovery(){$("main").innerHTML=`<section class="card"><h1>Set your new password</h1><p class="muted">Choose a new password for your QCM Trainer account.</p><input id="newPassword" type="password" placeholder="New password" autocomplete="new-password"><input id="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password"><div class="actions"><button class="primary" id="updatePasswordBtn">Update Password</button></div><div id="status" class="status"></div></section>`;$("updatePasswordBtn").onclick=updatePassword}
async function updatePassword(){const a=$("newPassword").value,b=$("confirmPassword").value;if(a.length<6){setStatus('Password must be at least 6 characters.');return}if(a!==b){setStatus('Passwords do not match.');return}setStatus('Updating password…');const r=await supabase.auth.updateUser({password:a});if(r.error){setStatus(r.error.message,'danger');return}recoveringPassword=false;user=r.data.user||user;await loadBank();page='dashboard';render()}
function renderDashboard(){const n=bank.length;$("main").innerHTML=`<section class="card"><div class="mode-kicker"><span class="mode-dot"></span> TRAINING</div><h1 style="margin:7px 0 6px">Choose your training mode</h1><p class="muted">Choose how you want to practice today.</p><div class="grid"><div class="stat"><span class="muted">Question bank</span><b>${n}</b></div><div class="stat"><span class="muted">Exam pass mark</span><b>68%</b></div><div class="stat"><span class="muted">Account</span><b style="font-size:16px;word-break:break-word">${esc(user.email)}</b></div></div><div class="mode-grid"><button class="mode-card" id="exam"><span class="mode-kicker">SIMULATE THE EXAM</span><h2>EXAM MODE</h2><div class="mode-count">65 Questions</div><div class="mode-desc">A random selection from your ${n}-question bank.<br><b>68% required to pass.</b></div><div class="mode-arrow">Start Exam →</div></button><button class="mode-card quick-card" id="quick"><span class="mode-kicker">FAST PRACTICE</span><h2>QUICK QUIZ</h2><div class="mode-count">10 Questions</div><div class="mode-desc">A short random quiz for quick practice.<br><b>Final score and percentage saved.</b></div><div class="mode-arrow">Start Quick →</div></button><button class="mode-card" id="full"><span class="mode-kicker">COMPLETE PRACTICE</span><h2>FULL MODE</h2><div class="mode-count">${n} Questions</div><div class="mode-desc">Practice the complete question bank in random order.<br><b>Final percentage shown and saved.</b></div><div class="mode-arrow">Start Full →</div></button></div></section>`;$("exam").onclick=()=>startQuiz('exam');$("quick").onclick=()=>startQuiz('quick');$("full").onclick=()=>startQuiz('full')}

function startQuiz(mode){if(!bank.length){alert('No question bank is available.');return}const count=mode==='exam'?65:mode==='quick'?10:bank.length;quiz={mode,items:shuffle(bank).slice(0,Math.min(count,bank.length)),index:0,correct:0,answers:[],locked:false,startedAt:new Date().toISOString()};page='quiz';render()}

function renderQuiz(){if(!quiz){renderDashboard();return}if(quiz.index>=quiz.items.length){finishQuiz();return}const q=quiz.items[quiz.index];const selected=quiz.answers[quiz.index]?.selected||[];const correct=Array.isArray(q.correct)?q.correct.map(String):[String(q.correct)];const multi=correct.length>1;const score=pct(quiz.correct,quiz.index);const label=quiz.mode==='exam'?'Exam Mode':quiz.mode==='quick'?'Quick Quiz':'Full Mode';const entries=Object.entries(q.options||{}).sort(([a],[b])=>a.localeCompare(b));$("main").innerHTML=`<section class="card"><div class="topline"><span class="pill">${label} · Question ${quiz.index+1} / ${quiz.items.length}</span><span class="score">Score: ${score}%</span></div><div class="progress"><div class="bar" style="width:${quiz.index/quiz.items.length*100}%"></div></div><div class="muted">${multi?'Select all that apply':'Select one answer'}</div><div class="q">${esc(q.question)}</div><div class="answers">${entries.map(([k,v])=>`<label class="answer ${quiz.locked&&correct.includes(k)?'correct':''} ${quiz.locked&&selected.includes(k)&&!correct.includes(k)?'incorrect':''}"><input name="answer" type="${multi?'checkbox':'radio'}" value="${esc(k)}" ${selected.includes(k)?'checked':''} ${quiz.locked?'disabled':''}><span><b>${esc(k)}.</b> ${esc(v)}</span></label>`).join('')}</div>${quiz.locked?`<div class="feedback ${quiz.answers[quiz.index].isCorrect?'good':'bad'}"><strong>${quiz.answers[quiz.index].isCorrect?'Correct':'Incorrect'}</strong><div class="explain"><b>Correct answer:</b> ${esc(correct.join(', '))}<br><br>${esc(q.explanation||'No explanation available.')}</div></div>`:''}<div class="actions">${quiz.locked?`<button class="primary" id="next">${quiz.index===quiz.items.length-1?'Finish Quiz':'Next Question'}</button>`:'<button class="primary" id="validate">Validate Answer</button>'}</div></section>`;$("validate")?.addEventListener('click',validateAnswer);$("next")?.addEventListener('click',()=>{quiz.index++;quiz.locked=false;render()})}

function validateAnswer(){const q=quiz.items[quiz.index];const selected=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(!selected.length){alert('Please select an answer.');return}const correct=Array.isArray(q.correct)?q.correct.map(String):[String(q.correct)];const isCorrect=selected.length===correct.length&&selected.every(x=>correct.includes(x));quiz.answers[quiz.index]={selected,isCorrect};if(isCorrect)quiz.correct++;quiz.locked=true;render()}
async function finishQuiz(){const mode=quiz.mode,score=quiz.correct,total=quiz.items.length,p=pct(score,total),passed=mode==='exam'?p>=60:null;const attempt={user_id:user.id,question_bank_id:bankId,score,total,percentage:p,passed,started_at:quiz.startedAt,completed_at:new Date().toISOString(),answers:quiz.answers,mode};const r=await supabase.from('quiz_attempts').insert(attempt);if(r.error){console.error(r.error);alert('The quiz result could not be saved to history. Please try again.');return}const label=mode==='exam'?'Exam Mode':mode==='quick'?'Quick Quiz':'Full Mode';$("main").innerHTML=`<section class="card"><span class="pill">${label} complete</span><h1>Quiz complete</h1><div class="result ${passed===null?'':passed?'pass':'fail'}">${p}%</div><p class="muted">${score} correct out of ${total}.</p>${passed!==null?`<p class="${passed?'good':'danger'}"><b>${passed?'PASS':'FAIL'}</b> · 68% required.</p>`:'<p class="good"><b>Saved to History</b></p>'}<div class="actions"><button class="primary" id="retry">Retry ${label}</button><button class="ghost" id="historyBtn">View History</button><button class="ghost" id="dashBtn">Dashboard</button></div></section>`;$("retry").onclick=()=>startQuiz(mode);$("historyBtn").onclick=()=>{quiz=null;page='history';render()};$("dashBtn").onclick=()=>{quiz=null;page='dashboard';render()}}

async function renderHistory(){$("main").innerHTML=`<section class="card"><h1>Quiz History</h1><div id="history" class="empty">Loading…</div></section>`;const r=await supabase.from('quiz_attempts').select('mode,score,total,percentage,passed,completed_at').eq('user_id',user.id).order('completed_at',{ascending:false});if(r.error){$("history").textContent=r.error.message;return}if(!r.data?.length){$("history").textContent='No quizzes completed yet.';return}$("history").className='';$("history").innerHTML=`<table><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Percentage</th><th>Result</th></tr></thead><tbody>${r.data.map(x=>{const m=x.mode==='exam'?'Exam':x.mode==='quick'?'Quick':'Full';return `<tr><td>${new Date(x.completed_at).toLocaleString()}</td><td>${m}</td><td>${x.score}/${x.total}</td><td>${Number(x.percentage)}%</td><td>${x.passed===null?'—':x.passed?'<span class="good">PASS</span>':'<span class="danger">FAIL</span>'}</td></tr>`}).join('')}</tbody></table>`}

function renderBank(){$("main").innerHTML=`<section class="card"><h1>Question Bank</h1><p class="muted">Current shared bank: <b>${bank.length} questions</b>.</p><p class="muted">The question bank is read-only in the app. Owner imports are handled separately.</p></section>`}
function renderSettings(){$("main").innerHTML=`<section class="card"><h1>Settings</h1><p class="muted">Signed in as</p><p><b>${esc(user.email)}</b></p><div class="actions" style="justify-content:flex-start"><button class="ghost" id="settingsLogout">Sign out</button></div></section>`;$("settingsLogout").onclick=async()=>{await supabase.auth.signOut();user=null;bank=[];render()}}
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recoveringPassword=true;render();return}if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){user=session?.user||user;if(user&&!recoveringPassword)loadBank().then(render)}if(event==='SIGNED_OUT'){user=null;bank=[];quiz=null;page='dashboard';recoveringPassword=false;render()}});
boot();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=9').catch(()=>{});}</script>
</body>
</html>
