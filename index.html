<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="./manifest.webmanifest">
<title>QCM Trainer</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#181d25;--text:#eef2f7;--muted:#9ba6b5;--line:#28303b;--accent:#7c9cff;--good:#54d68a;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:1000px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 42px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:750;font-size:20px}.nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}.nav button,.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 12px;border-radius:10px}.nav button.active,.nav button:hover,.ghost.active{color:var(--text);background:var(--panel2)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.16)}h1{font-size:32px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:var(--panel2);border-radius:12px}.stat b{font-size:24px;display:block;margin-top:5px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{font-weight:700}.progress{height:7px;background:#252b34;border-radius:99px;overflow:hidden;margin:15px 0 24px}.bar{height:100%;background:var(--accent);transition:width .2s}.q{font-size:20px;line-height:1.45;margin:16px 0 20px}.answers{display:grid;gap:10px}.answer{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--text)}.answer input{margin-top:4px;accent-color:var(--accent)}.answer.correct{border-color:var(--good)}.answer.incorrect{border-color:var(--bad)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.feedback{margin-top:18px;padding:15px;border-radius:12px;border:1px solid var(--line)}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}.explain{line-height:1.55;color:#d5dbe4}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}.notice{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);line-height:1.5}.status{margin-top:12px;color:var(--muted);line-height:1.45}.danger{color:var(--bad)}.good{color:var(--good)}input[type=email],input[type=password]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:10px 0;font-size:16px}label.file{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:11px 14px;border-radius:10px;cursor:pointer}input[type=file]{display:none}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}.empty{padding:30px;text-align:center;color:var(--muted)}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.mode-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:190px;padding:23px;background:linear-gradient(145deg,#151b24,#10151c);color:var(--text);border:1px solid var(--line);border-radius:17px;text-align:left;overflow:hidden;cursor:pointer}.mode-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}.mode-card h2{margin:10px 0 7px;font-size:15px;letter-spacing:.09em;font-weight:800}.mode-count{font-size:30px;font-weight:800;margin:13px 0 9px}.mode-desc{font-size:14px;line-height:1.55;color:var(--muted)}.mode-arrow{margin-top:auto;padding-top:20px;color:var(--accent);font-size:13px;font-weight:750}@media(max-width:720px){.app{padding:12px}.grid{grid-template-columns:1fr 1fr}.mode-grid{grid-template-columns:1fr;gap:12px}header{align-items:flex-start;flex-direction:column}.q{font-size:18px}.topline{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="app"><header><div class="brand">QCM Trainer</div><nav class="nav" id="nav"></nav></header><main id="main"></main></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://umlrugknndundkrfvofa.supabase.co";
const SUPABASE_KEY="sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l";
const OWNER_ID="a40bea08-44dd-4c34-a455-38bfc7e68cb6";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"qcm-trainer-auth"}});
let bank=[],bankId=null,user=null,quiz=null,page="dashboard",authMode="signin";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const pct=(n,d)=>d?Math.round(n/d*1000)/10:0;
function setStatus(id,msg,cls=""){const el=$(id);if(el){el.className="status "+cls;el.textContent=msg}}
async function loadUser(){const {data}=await supabase.auth.getSession();user=data.session?.user||null;if(!user){bank=[];bankId=null;return}const {data:b,error}=await supabase.from("question_banks").select("*").eq("is_active",true).order("created_at",{ascending:false}).limit(1).maybeSingle();if(error){console.error(error);bank=[];bankId=null}else if(b){bank=b.questions||[];bankId=b.id}else{bank=[];bankId=null}}
function render(){nav();if(!user){loginPage();return}if(page==="dashboard")dashboard();else if(page==="quiz")quizPage();else if(page==="history")historyPage();else if(page==="bank")bankPage();else settingsPage()}
function nav(){$("#nav").innerHTML=user?[["dashboard","Dashboard"],["quiz","Start Quiz"],["history","Quiz History"],["bank","Question Bank"],["settings","Settings"]].map(([id,l])=>`<button class="${page===id?"active":""}" data-page="${id}">${l}</button>`).join("")+`<button id="logout">Sign out</button>`:"";document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$("#logout")?.addEventListener("click",async()=>{await supabase.auth.signOut();page="dashboard";render()})}
function loginPage(){$("#nav").innerHTML="";$('main');$("#main").innerHTML=`<section class="card"><h1>Welcome back</h1><p class="muted">Sign in once and QCM Trainer will keep your session on this device.</p><div style="display:flex;gap:8px;margin:18px 0 4px"><button class="ghost ${authMode==='signin'?"active":""}" id="signInTab">Sign In</button><button class="ghost ${authMode==='signup'?"active":""}" id="signUpTab">Create Account</button></div><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div class="actions"><button class="primary" id="authBtn">Sign In</button></div><div class="actions" style="justify-content:flex-start"><button class="ghost" id="magicBtn">Send Magic Link</button><button class="ghost" id="forgot">Forgot Password?</button></div><div id="loginStatus" class="status"></div></section>`;$("#signInTab").onclick=()=>{authMode="signin";render()};$("#signUpTab").onclick=()=>{authMode="signup";loginSignupPage()};$("#authBtn").onclick=signIn;$("#magicBtn").onclick=sendMagicLink;$("#forgot").onclick=resetPassword}
function loginSignupPage(){$("#nav").innerHTML="";$("#main").innerHTML=`<section class="card"><h1>Create your account</h1><p class="muted">Use an email and a password of at least 6 characters.</p><div style="display:flex;gap:8px;margin:18px 0 4px"><button class="ghost" id="signInTab">Sign In</button><button class="ghost active" id="signUpTab">Create Account</button></div><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="new-password"><div class="actions"><button class="primary" id="authBtn">Create Account</button></div><div id="loginStatus" class="status"></div></section>`;$("#signInTab").onclick=()=>{authMode="signin";render()};$("#authBtn").onclick=signUp}
async function signIn(){const email=$("#email").value.trim(),password=$("#password").value;if(!email||!password){setStatus("#loginStatus","Enter your email and password.");return}setStatus("#loginStatus","Signing in…");const {error}=await supabase.auth.signInWithPassword({email,password});if(error)setStatus("#loginStatus",error.message,"danger")}
async function signUp(){const email=$("#email").value.trim(),password=$("#password").value;if(!email||password.length<6){setStatus("#loginStatus","Enter an email and a password of at least 6 characters.");return}setStatus("#loginStatus","Creating account…");const {data,error}=await supabase.auth.signUp({email,password});if(error){setStatus("#loginStatus",error.message,"danger");return}if(data.session){await loadUser();render()}else setStatus("#loginStatus","Account created. Confirm your email if required, then sign in.","good")}
async function sendMagicLink(){const email=$("#email").value.trim();if(!email){setStatus("#loginStatus","Enter your email first.");return}setStatus("#loginStatus","Sending magic link…");const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});if(error)setStatus("#loginStatus",error.message,"danger");else setStatus("#loginStatus","Magic link sent. Open the email on this device.","good")}
async function resetPassword(){const email=$("#email").value.trim();if(!email){setStatus("#loginStatus","Enter your email first.");return}setStatus("#loginStatus","Sending password reset…");const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)setStatus("#loginStatus",error.message,"danger");else setStatus("#loginStatus","Password reset email sent.","good")}
function dashboard(){$("#main").innerHTML=`<section class="card"><h1>Welcome back</h1><p class="muted">Your question bank is ready. Choose a mode.</p><div class="grid"><div class="stat"><span class="muted">Question bank</span><b>${bank.length}</b></div><div class="stat"><span class="muted">Exam size</span><b>${Math.min(65,bank.length)}</b></div><div class="stat"><span class="muted">Pass mark</span><b>60%</b></div></div><div class="mode-grid"><button class="mode-card" id="examMode"><span class="muted">EXAM MODE</span><h2>65 RANDOM QUESTIONS</h2><div class="mode-desc">Simulates the real exam. <b>60% required to pass.</b></div><div class="mode-arrow">Start Exam →</div></button><button class="mode-card" id="fullMode"><span class="muted">FULL MODE</span><h2>ALL QUESTIONS</h2><div class="mode-desc">Practice the complete question bank with explanations.</div><div class="mode-arrow">Start Full Practice →</div></button></div></section>`;$("#examMode").onclick=()=>startQuiz("exam");$("#fullMode").onclick=()=>startQuiz("full")}
function startQuiz(mode){if(!bank.length){alert("No question bank is available yet.");return}quiz={mode,items:mode==="full"?shuffle(bank):shuffle(bank).slice(0,Math.min(65,bank.length)),index:0,answers:[],correct:0,locked:false};page="quiz";render()}
function quizPage(){if(!quiz)return dashboard();if(quiz.index>=quiz.items.length){finishQuiz();return}const q=quiz.items[quiz.index],sel=quiz.answers[quiz.index]?.selected||[],multi=(q.correct||[]).length>1,score=pct(quiz.correct,quiz.items.length);$("#main").innerHTML=`<section class="card"><div class="topline"><span class="pill">${quiz.mode==="exam"?"Exam Mode":"Full Mode"} · Question ${quiz.index+1} / ${quiz.items.length}</span><span class="score">Score: ${score}%</span></div><div class="progress"><div class="bar" style="width:${quiz.index/quiz.items.length*100}%"></div></div><div class="muted">${multi?"Select all that apply":"Select one answer"}</div><div class="q">${esc(q.question)}</div><div class="answers">${Object.entries(q.options||{}).map(([k,v])=>`<label class="answer ${quiz.locked&&q.correct.includes(k)?"correct":""} ${quiz.locked&&sel.includes(k)&&!q.correct.includes(k)?"incorrect":""}"><input type="${multi?"checkbox":"radio"}" name="answer" value="${esc(k)}" ${sel.includes(k)?"checked":""} ${quiz.locked?"disabled":""}><span><b>${esc(k)}.</b> ${esc(v)}</span></label>`).join("")}</div>${quiz.locked?`<div class="feedback ${quiz.answers[quiz.index].correct?"good":"bad"}"><strong>${quiz.answers[quiz.index].correct?"Correct":"Incorrect"}</strong><div class="explain"><b>Correct answer:</b> ${esc((q.correct||[]).join(", "))}<br><br>${esc(q.explanation||"")}</div></div>`:""}<div class="actions">${quiz.locked?`<button class="primary" id="next">${quiz.index===quiz.items.length-1?"Finish Quiz":"Next Question"}</button>`:`<button class="primary" id="validate">Validate Answer</button>`}</div></section>`;if(!quiz.locked)$("#validate").onclick=()=>{const vals=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(!vals.length)return;const correct=q.correct||[];const ok=vals.length===correct.length&&vals.every(x=>correct.includes(x));quiz.answers[quiz.index]={selected:vals,correct:ok};if(ok)quiz.correct++;quiz.locked=true;render()};else $("#next").onclick=()=>{quiz.index++;quiz.locked=false;render()}}
async function finishQuiz(){const total=quiz.items.length,percentage=pct(quiz.correct,total),mode=quiz.mode,result={mode,score:quiz.correct,total,percentage,passed:mode==="exam"?percentage>=60:true};const record={user_id:user.id,question_bank_id:bankId,mode,score:quiz.correct,total,percentage,passed:result.passed,completed_at:new Date().toISOString(),answers:quiz.answers};const {error}=await supabase.from("quiz_attempts").insert(record);if(error)console.error(error);quiz=null;showResult(result)}
function showResult(r){$("#main").innerHTML=`<section class="card"><div class="pill">${r.mode==="exam"?"Exam Mode":"Full Mode"}</div><h1>Final Score</h1><div style="font-size:48px;font-weight:800">${r.percentage}%</div><p class="${r.passed?"good":"danger"}"><b>${r.mode==="exam"?(r.passed?"PASSED":"FAILED"):"COMPLETED"}</b>${r.mode==="exam"?(r.passed?" — You reached 60%.":" — You need at least 60%."):""}</p><div class="actions"><button class="ghost" id="historyBtn">View History</button><button class="primary" id="retry">Retry</button></div></section>`;$("#historyBtn").onclick=()=>{page="history";render()};$("#retry").onclick=()=>startQuiz(r.mode)}
async function historyPage(){const {data,error}=await supabase.from("quiz_attempts").select("score,total,percentage,passed,completed_at,mode").eq("user_id",user.id).order("completed_at",{ascending:false});if(error){$("#main").innerHTML=`<section class="card"><h1>Quiz History</h1><p class="danger">${esc(error.message)}</p></section>`;return}const rows=data||[],avg=rows.length?Math.round(rows.reduce((s,x)=>s+Number(x.percentage),0)/rows.length*10)/10:0,best=rows.length?Math.max(...rows.map(x=>Number(x.percentage))):0;$("#main").innerHTML=`<section class="card"><h1>Quiz History</h1><div class="grid"><div class="stat"><span class="muted">Tests</span><b>${rows.length}</b></div><div class="stat"><span class="muted">Average</span><b>${avg}%</b></div><div class="stat"><span class="muted">Best</span><b>${best}%</b></div></div>${rows.length?`<table><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Result</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.completed_at).toLocaleString()}</td><td>${x.mode==="full"?"Full":"Exam"}</td><td>${x.score}/${x.total} (${x.percentage}%)</td><td>${x.mode==="full"?"—":x.passed?"✅ Passed":"❌ Failed"}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No tests completed yet.</div>`}</section>`}
function bankPage(){$("#main").innerHTML=`<section class="card"><h1>Question Bank</h1><p class="muted">Current bank: <b>${bank.length} questions</b></p><label class="file">📄 Import New PDF<input id="pdf" type="file" accept="application/pdf"></label><div class="notice">Only the question bank owner can replace the shared bank.</div><div id="importStatus" class="status"></div></section>`;$("#pdf").onchange=importPDF}
async function importPDF(e){if(user?.id!==OWNER_ID){setStatus("#importStatus","Only the question bank owner can import a new PDF.","danger");return}const file=e.target.files[0];if(!file)return;setStatus("#importStatus","Reading PDF…");try{const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;let text="";for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(" ")+"\n"}const parsed=parseImportedText(text);if(!parsed.length)throw Error("No questions were detected.");if(!confirm(`Detected ${parsed.length} questions. Replace the shared question bank?`))return;const {data:old}=await supabase.from("question_banks").select("id").eq("is_active",true).order("created_at",{ascending:false}).limit(1).maybeSingle();if(old?.id)await supabase.from("question_banks").update({is_active:false}).eq("id",old.id);const {data:newBank,error}=await supabase.from("question_banks").insert({user_id:user.id,name:file.name,question_count:parsed.length,questions:parsed,is_active:true}).select().single();if(error)throw error;bank=newBank.questions||[];bankId=newBank.id;setStatus("#importStatus",`Imported ${bank.length} questions successfully.`,"good")}catch(err){setStatus("#importStatus",err.message||"Import failed.","danger")}}
function parseImportedText(text){const out=[];for(const part of text.split(/(?=NO\.\s*\d+\b)/)){const m=part.match(/^NO\.\s*(\d+)\s+/),a=part.match(/Answer:\s*([A-D](?:\s+[A-D])*)/);if(!m||!a)continue;const before=part.slice(0,a.index),opts=[...before.matchAll(/(?:^|\n)\s*([A-D])\.\s*(.*?)(?=\n\s*[A-D]\.\s|$)/gs)];if(opts.length!==4)continue;const q=before.slice(0,opts[0].index).replace(/^NO\.\s*\d+\s*/,"").replace(/\s+/g," ").trim(),options={};opts.forEach(o=>options[o[1]]=o[2].replace(/\s+/g," ").trim());const ex=part.match(/Explanation:\s*(.*?)(?=NO\.\s*\d+\b|$)/s);out.push({id:Number(m[1]),question:q,options,correct:a[1].split(/\s+/),explanation:(ex?.[1]||"").replace(/\s+/g," ").trim(),source:"Imported PDF"})}return out.sort((a,b)=>a.id-b.id)}
function settingsPage(){$("#main").innerHTML=`<section class="card"><h1>Settings</h1><p class="muted">Exam Mode: 65 random questions · Full Mode: all questions</p><p class="muted">Passing score: 60%</p><p class="muted">Cloud sync: <span class="good">Enabled</span></p><p class="muted">Signed in as: ${esc(user.email)}</p></section>`}
async function boot(){try{await loadUser();render()}catch(e){console.error(e);$("#main").innerHTML=`<section class="card"><h1>QCM Trainer</h1><p class="danger">Startup error: ${esc(e.message||e)}</p><button class="primary" onclick="location.reload()">Reload</button></section>`}}
supabase.auth.onAuthStateChange(async(event,session)=>{user=session?.user||null;if(user){await loadUser();page="dashboard";render()}else{bank=[];bankId=null;render()}});
boot();
</script></body></html>
