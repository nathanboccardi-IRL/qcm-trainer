<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Platform Developer I · QCM Trainer</title><style>body{margin:0;background:#0b0d10;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#12161c;border:1px solid #28303b;border-radius:16px;padding:22px}h1{margin-top:0}.muted{color:#9ba6b5}.primary,.ghost{padding:11px 16px;border-radius:10px;font:inherit;cursor:pointer}.primary{background:#7c9cff;color:white;border:0;font-weight:700}.ghost{background:transparent;color:#eef2f7;border:1px solid #28303b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input{width:100%;padding:12px;box-sizing:border-box;background:#181d25;color:#eef2f7;border:1px solid #28303b;border-radius:10px;margin:10px 0}#status{margin-top:14px;line-height:1.5}.good{color:#54d68a}.bad{color:#ff6b7a}</style></head><body><div class="wrap"><div class="card"><h1>Import Platform Developer I</h1><p class="muted">Sign in with the QCM Trainer owner account and choose the Platform Developer I PDF. The importer removes only the repeating watermark and exact duplicate questions; it keeps the question wording, options, and source answer keys.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="pdf" type="file" accept="application/pdf"><div class="actions"><button class="primary" id="run">Import PDF</button><button class="ghost" onclick="location.href='./'">Back to QCM Trainer</button></div><div id="status"></div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const URL='https://umlrugknndundkrfvofa.supabase.co',KEY='sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l',OWNER='a40bea08-44dd-4c34-a455-38bfc7e68cb6',BANK_NAME='Platform Developer I';const supabase=createClient(URL,KEY);const $=id=>document.getElementById(id);const set=(m,c='')=>{$('status').textContent=m;$('status').className=c};
function clean(s){return String(s??'').replace(/www\.priscillahongsalesforce\.com/gi,'').replace(/\s+/g,' ').trim()}
function keyPart(s){return clean(s).toLowerCase()}
async function pageText(page){const c=await page.getTextContent(),rows=new Map();for(const item of c.items){if(!item.str)continue;const y=Math.round(item.transform[5]);if(!rows.has(y))rows.set(y,[]);rows.get(y).push(item)}return [...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,items])=>items.sort((a,b)=>a.transform[4]-b.transform[4]).map(item=>item.str).join(' ').trim()).filter(Boolean).join('\n')}
async function extract(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let p=1;p<=pdf.numPages;p++)text+=(await pageText(await pdf.getPage(p)))+'\n';
  // Parse by question headings first. This is more reliable than pairing each answer marker
  // with the previous block because PDFs can contain unusual spacing/line wrapping.
  const headingRe=/(?:^|\n)\s*Question\s+(\d+)\s*\|\s*(Multi\s*-\s*select|Multiple\s+Choice)\s*(?=\n|$)/gi;
  const headings=[...text.matchAll(headingRe)];
  // Fallback for alternate numbering formats still used by some PDFs.
  if(!headings.length){const alt=/(?:^|\n)\s*(\d+)\s*[\.\-]\s*(Multi\s*-\s*select|Multiple\s+Choice)\s*(?=\n|$)/gi;for(const m of text.matchAll(alt))headings.push(m)}
  const questions=[],invalid=[];
  for(let i=0;i<headings.length;i++){
    const h=headings[i],start=h.index+h[0].length,end=i+1<headings.length?headings[i+1].index:text.length,block=text.slice(start,end);
    const answerMatch=block.match(/Correct\s*Answer\s*:\s*([A-E]+)/i)||block.match(/Correct\s*answer\s*([A-E]+)/i);
    const answer=answerMatch?answerMatch[1].toUpperCase():'';
    // Prefer line-based options; then fall back to whitespace-based extraction.
    let optionMatches=[...block.matchAll(/(?:^|\n)\s*([A-E])\.\s*([\s\S]*?)(?=\n\s*[A-E]\.\s|\n\s*Correct\s*Answer\s*:|$)/gi)];
    if(optionMatches.length<2)optionMatches=[...block.matchAll(/(?:^|\s)([A-E])\.\s*([\s\S]*?)(?=(?:\s)[A-E]\.\s|\s*Correct\s*Answer\s*:|$)/gi)];
    const options=Object.fromEntries(optionMatches.map(m=>[m[1].toUpperCase(),clean(m[2])]));
    const correct=[...answer].filter(letter=>Object.hasOwn(options,letter));
    if(!answer||optionMatches.length<2||!correct.length){invalid.push(h[1]);continue}
    const firstOption=optionMatches[0];
    const question=clean(block.slice(0,firstOption.index));
    if(!question){invalid.push(h[1]);continue}
    questions.push({id:`platform-developer-i-${h[1]}`,source:'PlatformDev1.pdf',sourceNumber:Number(h[1]),type:clean(h[2]),question,options,correct,explanation:''});
  }
  const seen=new Set(),deduped=[];for(const q of questions){const key=[keyPart(q.question),Object.entries(q.options).map(([letter,text])=>letter+':'+keyPart(text)).join('|'),q.correct.join(',')].join('||');if(seen.has(key))continue;seen.add(key);deduped.push(q)}
  return {total:headings.length,parsed:questions.length,deduped:deduped.length,duplicates:questions.length-deduped.length,invalid,questions:deduped}}
$('run').onclick=async()=>{try{const file=$('pdf').files[0];if(!file)return set('Choose the Platform Developer I PDF first.','bad');set('Signing in…');const auth=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(auth.error)throw auth.error;if(auth.data.user.id!==OWNER)throw new Error('This import tool is restricted to the QCM Trainer owner account.');set('Reading PDF…');const out=await extract(file);if(out.deduped<1)throw new Error('No questions were extracted from the PDF.');if(out.invalid.length)throw new Error(`Stopped: ${out.invalid.length} question block(s) could not be parsed (${out.invalid.join(', ')}).`);set(`Extracted ${out.total} question blocks; ${out.duplicates} exact duplicate(s) removed. Publishing ${out.deduped} questions…`);const old=await supabase.from('question_banks').update({is_active:false}).eq('name',BANK_NAME);if(old.error)throw old.error;const ins=await supabase.from('question_banks').insert({user_id:auth.data.user.id,name:BANK_NAME,question_count:out.deduped,questions:out.questions,is_active:true}).select('id').single();if(ins.error)throw ins.error;set(`Done: ${out.deduped} unique Platform Developer I questions are now live.`, 'good');setTimeout(()=>location.href='./',900)}catch(e){console.error(e);set(e.message||String(e),'bad')}};
</script></body></html>
