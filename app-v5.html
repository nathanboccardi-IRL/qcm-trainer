<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>QCM Trainer</title><style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#181d25;--text:#eef2f7;--muted:#9ba6b5;--line:#28303b;--accent:#7c9cff;--good:#54d68a;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:1050px;margin:auto;padding:18px 16px 42px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:800;font-size:20px}.nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.nav button,.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 12px;border-radius:10px}.nav button.active,.nav button:hover,.ghost.active{color:var(--text);background:var(--panel2)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 30px #0003}h1{font-size:32px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:var(--panel2);border-radius:12px}.stat b{font-size:24px;display:block;margin-top:5px}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.mode-card{display:flex;flex-direction:column;align-items:flex-start;min-height:175px;padding:22px;background:linear-gradient(145deg,#151b24,#10151c);color:var(--text);border:1px solid var(--line);border-radius:17px;text-align:left}.mode-card.selected{border-color:var(--accent)}.mode-count{font-size:30px;font-weight:800;margin:13px 0 8px}.mode-desc{font-size:14px;line-height:1.5;color:var(--muted)}.mode-arrow{margin-top:auto;padding-top:18px;color:var(--accent);font-weight:750}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{font-weight:700}.progress{height:7px;background:#252b34;border-radius:99px;overflow:hidden;margin:15px 0 24px}.bar{height:100%;background:var(--accent)}.q{font-size:20px;line-height:1.45;margin:16px 0 20px}.answers{display:grid;gap:10px}.answer{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:11px}.answer.correct{border-color:var(--good)}.answer.incorrect{border-color:var(--bad)}.feedback{margin-top:18px;padding:15px;border-radius:12px;border:1px solid var(--line)}.feedback.good{border-color:var(--good)}.feedback.bad{border-color:var(--bad)}.explain{line-height:1.55;color:#d5dbe4}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}.status{margin-top:12px;line-height:1.45}.danger{color:var(--bad)}.good{color:var(--good)}input[type=email],input[type=password],input[type=file]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin:10px 0;font-size:16px}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:10px;background:var(--panel2);margin-top:12px;line-height:1.5}@media(max-width:720px){.app{padding:12px}.grid{grid-template-columns:1fr 1fr}.mode-grid{grid-template-columns:1fr}.topline{align-items:flex-start;flex-direction:column}.nav{width:100%}.q{font-size:18px}}
</style></head><body><div class="app"><header><div class="brand">QCM Trainer <span style="font-size:11px;color:var(--muted)">v5.0</span></div><nav class="nav" id="nav"></nav></header><main id="main"></main></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://umlrugknndundkrfvofa.supabase.co";const SUPABASE_KEY="sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l";const OWNER_ID="a40bea08-44dd-4c34-a455-38bfc7e68cb6";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);const pct=(n,d)=>d?Math.round(n/d*1000)/10:0;
let user=null,banks=[],selectedBank=null,quiz=null,page='dashboard',authMode='signin',recovering=false;
async function loadBanks(){const r=await supabase.from('question_banks').select('id,name,questions,question_count,is_active,created_at').eq('is_active',true).order('created_at',{ascending:false});if(r.error){console.error(r.error);banks=[];return}banks=r.data||[]}
function render(){renderNav();if(recovering){renderRecovery();return}if(!user){renderLogin();return}if(page==='dashboard')renderDashboard();else if(page==='quiz')renderQuiz();else if(page==='history')renderHistory();else renderSettings()}
function renderNav(){if(!user){$('nav').innerHTML='';return}$('nav').innerHTML=`<button class="${page==='dashboard'?'active':''}" data-p="dashboard">Dashboard</button><button class="${page==='quiz'?'active':''}" data-p="quiz">Start Quiz</button><button class="${page==='history'?'active':''}" data-p="history">Quiz History</button><button class="${page==='settings'?'active':''}" data-p="settings">Settings</button><button id="logout">Sign out</button>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});$('logout').onclick=async()=>{await supabase.auth.signOut();user=null;quiz=null;render()}}
function renderLogin(){ $('main').innerHTML=`<section class="card"><h1>${authMode==='signin'?'Welcome back':'Create your account'}</h1><p class="muted">Sign in once and QCM Trainer will keep your session on this device.</p><div class="actions" style="justify-content:flex-start"><button class="ghost ${authMode==='signin'?'active':''}" id="signinTab">Sign In</button><button class="ghost ${authMode==='signup'?'active':''}" id="signupTab">Create Account</button></div><input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Password"><div class="actions"><button class="primary" id="authBtn">${authMode==='signin'?'Sign In':'Create Account'}</button></div>${authMode==='signin'?'<div class="actions" style="justify-content:flex-start"><button class="ghost" id="forgot">Forgot Password?</button></div>':''}<div id="status" class="status"></div></section>`;$('signinTab').onclick=()=>{authMode='signin';render()};$('signupTab').onclick=()=>{authMode='signup';render()};$('authBtn').onclick=authMode==='signin'?signIn:signUp;$('forgot')?.addEventListener('click',sendReset)}
function status(m,c=''){const e=$('status');if(e){e.textContent=m;e.className='status '+c}}
async function signIn(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return status('Enter your email and password.');status('Signing in…');const r=await supabase.auth.signInWithPassword({email,password});if(r.error)return status(r.error.message,'danger');user=r.data.user;await loadBanks();page='dashboard';render()}
async function signUp(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return status('Enter an email and a password of at least 6 characters.');status('Creating account…');const r=await supabase.auth.signUp({email,password});if(r.error)return status(r.error.message,'danger');if(r.data.session){user=r.data.user;await loadBanks();render()}else status('Account created. Confirm your email if required, then sign in.','good')}
async function sendReset(){const email=$('email').value.trim();if(!email)return status('Enter your email first.');const r=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.href});status(r.error?r.error.message:'Password reset email sent.',r.error?'danger':'good')}
function renderRecovery(){$('main').innerHTML=`<section class="card"><h1>Set your new password</h1><input id="newPassword" type="password" placeholder="New password"><input id="confirmPassword" type="password" placeholder="Confirm password"><div class="actions"><button class="primary" id="update">Update Password</button></div><div id="status" class="status"></div></section>`;$('update').onclick=async()=>{const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<6)return status('Password must be at least 6 characters.');if(a!==b)return status('Passwords do not match.');const r=await supabase.auth.updateUser({password:a});if(r.error)return status(r.error.message,'danger');recovering=false;user=r.data.user;await loadBanks();render()}}
function renderDashboard(){const available=banks.filter(b=>Array.isArray(b.questions)&&b.questions.length);$('main').innerHTML=`<section class="card"><div class="muted">TRAINING</div><h1>Choose your certification</h1><p class="muted">Select the QCM you want to practise, then choose a training mode.</p><div class="mode-grid">${available.map(b=>`<button class="mode-card ${selectedBank?.id===b.id?'selected':''}" data-bank="${b.id}"><div class="muted">CERTIFICATION</div><h2>${esc(b.name)}</h2><div class="mode-count">${b.questions.length}</div><div class="mode-desc">Questions available in this bank.</div><div class="mode-arrow">Choose →</div></button>`).join('')}</div>${!available.length?'<div class="notice">No active question bank is available.</div>':''}</section>${selectedBank?renderModesHtml(selectedBank):''}`;document.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{selectedBank=banks.find(x=>x.id===b.dataset.bank);render()})}
function renderModesHtml(b){const n=b.questions.length;return `<section class="card" style="margin-top:14px"><div class="pill">${esc(b.name)}</div><h1 style="margin-top:10px">Choose your training mode</h1><div class="mode-grid"><button class="mode-card" id="exam"><div class="muted">SIMULATE THE EXAM</div><div class="mode-count">65</div><div class="mode-desc">Random questions from this bank. <b>68% required to pass.</b></div><div class="mode-arrow">Start Exam →</div></button><button class="mode-card" id="quick"><div class="muted">FAST PRACTICE</div><div class="mode-count">10</div><div class="mode-desc">A short random quiz.</div><div class="mode-arrow">Start Quick →</div></button><button class="mode-card" id="full"><div class="muted">COMPLETE PRACTICE</div><div class="mode-count">${n}</div><div class="mode-desc">Every question in this bank, shuffled.</div><div class="mode-arrow">Start Full →</div></button></div></section>`}
function shuffleOptions(q){const entries=Object.entries(q.options||{}),s=shuffle(entries),labels='ABCDE'.slice(0,s.length).split(''),options={},map={};s.forEach(([old,v],i)=>{options[labels[i]]=v;map[String(old)]=labels[i]});const original=Array.isArray(q.correct)?q.correct.map(String):[String(q.correct)];return {...q,options,correct:original.map(k=>map[k]).filter(Boolean)}}
function startQuiz(mode){if(!selectedBank)return;const count=mode==='exam'?65:mode==='quick'?10:selectedBank.questions.length;const items=shuffle(selectedBank.questions).slice(0,Math.min(count,selectedBank.questions.length)).map(shuffleOptions);quiz={mode,bankId:selectedBank.id,bankName:selectedBank.name,items,index:0,correct:0,answers:[],locked:false,saving:false,startedAt:new Date().toISOString()};page='quiz';render()}
function renderQuiz(){if(!quiz)return renderDashboard();if(quiz.index>=quiz.items.length)return finishQuiz();const q=quiz.items[quiz.index],selected=quiz.answers[quiz.index]?.selected||[],correct=Array.isArray(q.correct)?q.correct.map(String):[String(q.correct)],multi=correct.length>1,answered=quiz.index+(quiz.locked?1:0),score=pct(quiz.correct,answered),label=quiz.mode==='exam'?'Exam':quiz.mode==='quick'?'Quick':'Full';$('main').innerHTML=`<section class="card"><div class="topline"><span class="pill">${esc(quiz.bankName)} · ${label} · Question ${quiz.index+1}/${quiz.items.length}</span><span class="score">Score: ${score}%</span></div><div class="progress"><div class="bar" style="width:${quiz.index/quiz.items.length*100}%"></div></div><div class="muted">${multi?'Select all that apply':'Select one answer'}</div><div class="q">${esc(q.question)}</div><div class="answers">${Object.entries(q.options||{}).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>`<label class="answer ${quiz.locked&&correct.includes(k)?'correct':''} ${quiz.locked&&selected.includes(k)&&!correct.includes(k)?'incorrect':''}"><input name="answer" type="${multi?'checkbox':'radio'}" value="${esc(k)}" ${selected.includes(k)?'checked':''} ${quiz.locked?'disabled':''}> <span><b>${k}.</b> ${esc(v)}</span></label>`).join('')}</div>${quiz.locked?`<div class="feedback ${quiz.answers[quiz.index].isCorrect?'good':'bad'}"><strong>${quiz.answers[quiz.index].isCorrect?'Correct':'Incorrect'}</strong><div class="explain"><b>Correct answer:</b> ${esc(correct.join(', '))}<br><br>${esc(q.explanation||'No explanation available.')}</div></div>`:''}<div class="actions">${quiz.locked?`<button class="primary" id="next">${quiz.index===quiz.items.length-1?'Finish Quiz':'Next Question'}</button>`:'<button class="primary" id="validate">Validate Answer</button>'}</div></section>`;$('validate')?.addEventListener('click',validateAnswer);$('next')?.addEventListener('click',()=>{quiz.index++;quiz.locked=false;render()})}
function validateAnswer(){if(quiz.locked)return;const q=quiz.items[quiz.index],selected=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(!selected.length)return alert('Please select an answer.');const correct=Array.isArray(q.correct)?q.correct.map(String):[String(q.correct)];const isCorrect=selected.length===correct.length&&selected.every(x=>correct.includes(x));quiz.answers[quiz.index]={selected,isCorrect};if(isCorrect)quiz.correct++;quiz.locked=true;render()}
async function finishQuiz(){if(!quiz||quiz.saving)return;quiz.saving=true;const score=quiz.correct,total=quiz.items.length,p=pct(score,total),passed=quiz.mode==='exam'?p>=68:null;const attempt={user_id:user.id,question_bank_id:quiz.bankId,score,total,percentage:p,passed,started_at:quiz.startedAt,completed_at:new Date().toISOString(),answers:quiz.answers,mode:quiz.mode};const r=await supabase.from('quiz_attempts').insert(attempt);if(r.error){quiz.saving=false;console.error(r.error);$('main').innerHTML=`<section class="card"><h1>Could not save result</h1><p class="danger">${esc(r.error.message)}</p><div class="actions"><button class="primary" id="retrySave">Try again</button></div></section>`;$('retrySave').onclick=finishQuiz;return}const label=quiz.mode==='exam'?'Exam':quiz.mode==='quick'?'Quick':'Full';$('main').innerHTML=`<section class="card"><span class="pill">${esc(quiz.bankName)} · ${label} complete</span><h1>Quiz complete</h1><div style="font-size:52px;font-weight:850">${p}%</div><p class="muted">${score} correct out of ${total}.</p>${passed===null?'<p class="good"><b>Saved to History</b></p>':`<p class="${passed?'good':'danger'}"><b>${passed?'PASS':'FAIL'}</b> · 68% required.</p>`}<div class="actions"><button class="primary" id="retry">Retry ${label}</button><button class="ghost" id="hist">View History</button><button class="ghost" id="dash">Dashboard</button></div></section>`;$('retry').onclick=()=>startQuiz(quiz.mode);$('hist').onclick=()=>{quiz=null;page='history';render()};$('dash').onclick=()=>{quiz=null;page='dashboard';render()}}
async function renderHistory(){$('main').innerHTML=`<section class="card"><h1>Quiz History</h1><div id="history" class="empty">Loading…</div></section>`;const r=await supabase.from('quiz_attempts').select('question_bank_id,mode,score,total,percentage,completed_at').eq('user_id',user.id).order('completed_at',{ascending:false});if(r.error)return $('history').textContent=r.error.message;if(!r.data?.length)return $('history').textContent='No quizzes completed yet.';const names=Object.fromEntries(banks.map(b=>[b.id,b.name]));$('history').className='';$('history').innerHTML=`<table><thead><tr><th>Date</th><th>Certification</th><th>Mode</th><th>Score</th><th>Percentage</th><th>Result</th></tr></thead><tbody>${r.data.map(x=>{const m=x.mode==='exam'?'Exam':x.mode==='quick'?'Quick':'Full';const passed=x.mode==='exam'?Number(x.percentage)>=68:null;return `<tr><td>${new Date(x.completed_at).toLocaleString()}</td><td>${esc(names[x.question_bank_id]||'Unknown')}</td><td>${m}</td><td>${x.score}/${x.total}</td><td>${Number(x.percentage)}%</td><td>${passed===null?'—':passed?'<span class="good">PASS</span>':'<span class="danger">FAIL</span>'}</td></tr>`}).join('')}</tbody></table>`}
function renderSettings(){$('main').innerHTML=`<section class="card"><h1>Settings</h1><p class="muted">Signed in as <b>${esc(user.email)}</b></p>${user.id===OWNER_ID?'<div class="notice">Owner tools: <a href="./import-app-builder.html" style="color:var(--accent)">Import ADM-202 App Builder PDF</a></div>':''}</section>`}
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;render();return}if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){user=session?.user||user;if(user)loadBanks().then(render)}if(event==='SIGNED_OUT'){user=null;quiz=null;render()}});(async()=>{const r=await supabase.auth.getSession();user=r.data.session?.user||null;if(user)await loadBanks();render()})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=12').catch(()=>{})}</script></body></html>
