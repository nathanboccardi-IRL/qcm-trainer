<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>QCM Trainer — Exam</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#181d25;--text:#eef2f7;--muted:#9ba6b5;--line:#28303b;--accent:#7c9cff;--good:#54d68a;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:900px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 50px}.brand{font-weight:800;font-size:22px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.16)}h1{font-size:32px;margin:0 0 8px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{padding:5px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}.progress{height:7px;background:#252b34;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:var(--accent)}.q{font-size:20px;line-height:1.5;margin:18px 0}.answers{display:grid;gap:10px}.answer{display:flex;gap:12px;align-items:flex-start;padding:15px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.answer.correct{border-color:var(--good)}.answer.incorrect{border-color:var(--bad)}.answer input{margin-top:4px;accent-color:var(--accent)}button{font:inherit;-webkit-appearance:none;appearance:none;border-radius:11px;padding:12px 16px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.feedback{margin-top:18px;padding:16px;border-radius:12px;border:1px solid var(--line)}.good{border-color:var(--good)}.bad{border-color:var(--bad)}input[type=email],input[type=password]{width:100%;padding:13px;margin:8px 0 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:16px}.status{margin-top:12px;color:var(--muted)}.result{text-align:center}.big{font-size:56px;font-weight:900;margin:18px 0}.hidden{display:none}@media(max-width:600px){h1{font-size:28px}.q{font-size:18px}.actions{flex-wrap:wrap}.actions button{width:100%}}
</style>
</head>
<body><div class="app"><div class="brand">QCM Trainer</div><main id="main"></main></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://umlrugknndundkrfvofa.supabase.co","sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l",{auth:{persistSession:true,autoRefreshToken:true,storageKey:"qcm-trainer-auth"}});
let user=null,bank=[],items=[],i=0,correct=0,locked=false,answers=[];
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function login(){ $("#main").innerHTML='<section class="card"><h1>Exam Mode</h1><p class="muted">65 random questions from the shared question bank.</p><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div class="actions"><button class="primary" id="login">Sign In</button></div><div id="status" class="status"></div></section>';$("#login").onclick=async()=>{const email=$("#email").value.trim(),password=$("#password").value;$("#status").textContent="Signing in…";const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){$("#status").textContent=error.message;return}user=data.user;await loadBank()}}
async function loadBank(){const {data,error}=await supabase.from("question_banks").select("id,questions").eq("is_active",true).order("created_at",{ascending:false}).limit(1).maybeSingle();if(error||!data){$("#main").innerHTML='<section class="card"><h1>Question bank unavailable</h1><p class="muted">Please try again in a moment.</p></section>';return}bank=data.questions||[];if(!bank.length){$("#main").innerHTML='<section class="card"><h1>No questions found</h1></section>';return}items=shuffle(bank).slice(0,Math.min(65,bank.length));i=0;correct=0;locked=false;answers=[];renderQuestion()}
function renderQuestion(){if(i>=items.length){finish();return}const q=items[i];const multi=(q.correct||[]).length>1;$("#main").innerHTML='<section class="card"><div class="top"><span class="pill">EXAM MODE · Question '+(i+1)+' / '+items.length+'</span><b>Score: '+Math.round(correct/Math.max(1,i)*100)+'%</b></div><div class="progress"><div class="bar" style="width:'+(i/items.length*100)+'%"></div></div><div class="muted">'+(multi?'Select all that apply':'Select one answer')+'</div><div class="q">'+esc(q.question)+'</div><div class="answers">'+Object.entries(q.options).map(([k,v])=>'<label class="answer '+(locked&&q.correct.includes(k)?'correct':'')+' '+(locked&&answers[i]?.selected.includes(k)&&!q.correct.includes(k)?'incorrect':'')+'"><input type="'+(multi?'checkbox':'radio')+'" name="answer" value="'+k+'" '+(answers[i]?.selected.includes(k)?'checked':'')+' '+(locked?'disabled':'')+'><span><b>'+k+'.</b> '+esc(v)+'</span></label>').join('')+'</div>'+(locked?'<div class="feedback '+(answers[i].correct?'good':'bad')+'"><b>'+(answers[i].correct?'Correct':'Incorrect')+'</b><p><b>Correct answer:</b> '+q.correct.join(', ')+'</p><p>'+esc(q.explanation||'')+'</p></div>':'')+'<div class="actions">'+(locked?'<button class="primary" id="next">'+(i===items.length-1?'Finish Exam':'Next Question')+'</button>':'<button class="primary" id="validate">Validate Answer</button>')+'</div></section>';if(!locked){$("#validate").onclick=()=>{const selected=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);if(!selected.length)return;const ok=selected.length===q.correct.length&&selected.every(x=>q.correct.includes(x));answers[i]={selected,correct:ok};if(ok)correct++;locked=true;renderQuestion()}}else $("#next").onclick=()=>{i++;locked=false;renderQuestion()}}
async function finish(){const total=items.length,p=Math.round(correct/total*1000)/10;await supabase.from("quiz_attempts").insert({user_id:user.id,question_bank_id:null,mode:'exam',score:correct,total,percentage:p,passed:p>=68,completed_at:new Date().toISOString(),answers});$("#main").innerHTML='<section class="card result"><h1>Final Score</h1><div class="big">'+p+'%</div><p>'+(p>=68?'PASSED — you reached the 68% passing score.':'FAILED — you need at least 68% to pass.')+'</p><div class="actions"><button class="primary" id="retry">Retry Exam</button><button id="out">Sign out</button></div></section>';$("#retry").onclick=loadBank;$("#out").onclick=async()=>{await supabase.auth.signOut();location.reload()}}
const {data:{session}}=await supabase.auth.getSession();user=session?.user||null;if(user)loadBank();else login();
</script></body></html>
