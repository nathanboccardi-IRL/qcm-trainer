<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Platform Developer I · QCM Trainer</title><style>body{margin:0;background:#0b0d10;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#12161c;border:1px solid #28303b;border-radius:16px;padding:22px}h1{margin-top:0}.muted{color:#9ba6b5}.primary,.ghost{padding:11px 16px;border-radius:10px;font:inherit;cursor:pointer}.primary{background:#7c9cff;color:white;border:0;font-weight:700}.ghost{background:transparent;color:#eef2f7;border:1px solid #28303b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input{width:100%;padding:12px;box-sizing:border-box;background:#181d25;color:#eef2f7;border:1px solid #28303b;border-radius:10px;margin:10px 0;font-size:16px}#status{margin-top:14px;line-height:1.5;white-space:pre-wrap}.good{color:#54d68a}.bad{color:#ff6b7a}</style></head><body><div class="wrap"><div class="card"><h1>Import Platform Developer I</h1><p class="muted">Choose the Platform Developer I PDF. The importer removes the repeating watermark, keeps the source wording/options/answer keys, removes exact duplicates, and skips only blocks that cannot be parsed.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="pdf" type="file" accept="application/pdf"><div class="actions"><button class="primary" id="run">Import PDF</button><button class="ghost" onclick="location.href='./'">Back to QCM Trainer</button></div><div id="status"></div></div></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import*as pdfjsLib from'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const URL='https://umlrugknndundkrfvofa.supabase.co',KEY='sb_publishable_ecsKv40x9hJDAPlZgGe-6A_pD79G_2l',OWNER='a40bea08-44dd-4c34-a455-38bfc7e68cb6',BANK_NAME='Platform Developer I';const supabase=createClient(URL,KEY);const $=id=>document.getElementById(id);const set=(m,c='')=>{$('status').textContent=m;$('status').className=c};
function clean(s){return String(s??'').replace(/www\.priscillahongsalesforce\.com/gi,'').replace(/\s+/g,' ').trim()}function keyPart(s){return clean(s).toLowerCase()}
async function pageText(page){const c=await page.getTextContent(),rows=new Map;for(const item of c.items){if(!item.str)continue;const y=Math.round(item.transform[5]);if(!rows.has(y))rows.set(y,[]);rows.get(y).push(item)}return[...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,items])=>items.sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' ').trim()).filter(Boolean).join('\n')}
function parseBlock(block,num,type){const answerMatch=block.match(/Correct\s*Answer\s*:\s*([A-E](?:\s*[,/&]\s*[A-E])*)/i)||block.match(/Correct\s*answer\s*[:\-]?\s*([A-E](?:\s*[,/&]\s*[A-E])*)/i);if(!answerMatch)return null;const answer=[...answerMatch[1].toUpperCase()].filter(x=>/[A-E]/.test(x));let optionMatches=[...block.matchAll(/(?:^|\n)\s*([A-E])\s*[\.\)]\s*([\s\S]*?)(?=\n\s*[A-E]\s*[\.\)]\s|\n\s*Correct\s*Answer\s*[:\-]|$)/gi)];if(optionMatches.length<2)optionMatches=[...block.matchAll(/(?:^|\s)([A-E])\s*[\.\)]\s+([\s\S]*?)(?=(?:\s)[A-E]\s*[\.\)]\s+|\s*Correct\s*Answer\s*[:\-]|$)/gi)];const options=Object.fromEntries(optionMatches.map(m=>[m[1].toUpperCase(),clean(m[2])]));const correct=[...new Set(answer)].filter(x=>Object.hasOwn(options,x));if(optionMatches.length<2||!correct.length)return null;const first=optionMatches[0],question=clean(block.slice(0,first.index));if(!question)return null;return{id:`platform-developer-i-${num}`,source:'PlatformDev1.pdf',sourceNumber:Number(num),type:clean(type),question,options,correct,explanation:''}}
async function extract(file){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let p=1;p<=pdf.numPages;p++)text+=(await pageText(await pdf.getPage(p)))+'\n';const headingRe=/(?:^|\n)\s*Question\s+(\d+)\s*\|\s*(Multi\s*-\s*select|Multiple\s+Choice)\s*(?=\n|$)/gi;let headings=[...text.matchAll(headingRe)];if(!headings.length){const alt=/(?:^|\n)\s*(?:Question\s*)?(\d+)\s*[\.\-\)]\s*(Multi\s*-\s*select|Multiple\s+Choice)\s*(?=\n|$)/gi;headings=[...text.matchAll(alt)]}const questions=[],skipped=[];for(let i=0;i<headings.length;i++){const h=headings[i],start=h.index+h[0].length,end=i+1<headings.length?headings[i+1].index:text.length,q=parseBlock(text.slice(start,end),h[1],h[2]);if(q)questions.push(q);else skipped.push(Number(h[1]))}const seen=new Set,deduped=[];for(const q of questions){const key=[keyPart(q.question),Object.entries(q.options).map(([l,v])=>l+':'+keyPart(v)).join('|'),q.correct.join(',')].join('||');if(seen.has(key))continue;seen.add(key);deduped.push(q)}return{total:headings.length,parsed:questions.length,deduped:deduped.length,duplicates:questions.length-deduped.length,skipped,questions:deduped}}
$('run').onclick=async()=>{try{const file=$('pdf').files[0];if(!file)return set('Choose the Platform Developer I PDF first.','bad');set('Signing in…');const auth=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(auth.error)throw auth.error;if(auth.data.user.id!==OWNER)throw new Error('This import tool is restricted to the QCM Trainer owner account.');set('Reading PDF…');const out=await extract(file);if(out.deduped<1)throw new Error('No questions were extracted from the PDF.');set(`Extracted ${out.total} blocks. Imported ${out.deduped} unique questions. Removed ${out.duplicates} exact duplicate(s).`+(out.skipped.length?`\nSkipped unparseable question(s): ${out.skipped.join(', ')}\nThese are skipped for now so the rest of the bank can be imported.`:''));const old=await supabase.from('question_banks').update({is_active:false}).eq('name',BANK_NAME);if(old.error)throw old.error;const ins=await supabase.from('question_banks').insert({user_id:auth.data.user.id,name:BANK_NAME,question_count:out.deduped,questions:out.questions,is_active:true}).select('id').single();if(ins.error)throw ins.error;set(`Done. ${out.deduped} unique Platform Developer I questions are now live.`+(out.skipped.length?`\nSkipped for now: Q${out.skipped.join(', Q')}.`:''),'good');setTimeout(()=>location.href='./',1200)}catch(e){console.error(e);set(e.message||String(e),'bad')}};</script></body></html>
